<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>形状二维码 · 手机实测页</title>
<style>
  :root { --bg:#0d1017; --pan:#161c28; --ink:#e2e8f5; --ink2:#93a0b8; --ink3:#697690; --acc:#5b8cff; --line:rgba(255,255,255,.09); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:20px 16px 12px; }
  h1 { margin:0 0 6px; font-size:19px; letter-spacing:-.01em; }
  .sub { font-size:13px; color:var(--ink3); line-height:1.6; }
  .tabs { display:flex; gap:6px; padding:0 16px 14px; overflow-x:auto; }
  .tabs button { flex:0 0 auto; border:1px solid var(--line); background:var(--pan); color:var(--ink2);
    font:inherit; font-size:13px; padding:7px 13px; border-radius:9px; cursor:pointer; }
  .tabs button.on { background:linear-gradient(180deg,rgba(91,140,255,.34),rgba(120,110,255,.2));
    color:#fff; border-color:rgba(120,150,255,.4); }
  .stage { margin:0 16px; background:var(--pan); border:1px solid var(--line); border-radius:16px;
    padding:18px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  canvas { display:block; width:min(78vw,320px); height:auto; background:#fff; border-radius:10px;
    image-rendering:pixelated; }
  .meta { font-size:12.5px; color:var(--ink3); text-align:center; line-height:1.7; }
  .meta b { color:var(--ink2); }
  .warn { color:#fbbf24; } .ok { color:#4ade80; }
  .row { display:flex; gap:10px; margin:14px 16px 0; }
  .row button { flex:1; font:inherit; font-size:14px; font-weight:550; padding:12px; border-radius:11px;
    border:1px solid var(--line); background:var(--pan); color:var(--ink); cursor:pointer; }
  .row button.pri { background:linear-gradient(180deg,rgba(91,140,255,.4),rgba(120,110,255,.26));
    border-color:rgba(120,150,255,.44); color:#fff; }
  .tips { margin:18px 16px 40px; padding:14px 16px; background:rgba(91,140,255,.07);
    border:1px solid rgba(91,140,255,.2); border-radius:12px; font-size:13px; color:var(--ink2); line-height:1.75; }
  .tips h3 { margin:0 0 8px; font-size:13.5px; color:var(--ink); }
  .tips ol { margin:0; padding-left:19px; } .tips li { margin-bottom:5px; }
  #log { margin:0 16px 30px; padding:12px; background:#0a0e15; border-radius:10px;
    font:11.5px/1.7 ui-monospace,monospace; color:#7c8aa3; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>形状二维码 · 手机实测</h1>
  <div class="sub">码点自己长成形状，不是套外框。请用<b>微信扫一扫</b>逐个测，把结果告诉我。</div>
</header>
<div class="tabs" id="tabs"></div>
<div class="stage">
  <canvas id="cv"></canvas>
  <div class="meta" id="meta">加载中…</div>
</div>
<div class="row">
  <button id="next">换下一个形状</button>
  <button class="pri" id="dl">保存图片</button>
</div>
<div class="tips">
  <h3>怎么测最准</h3>
  <ol>
    <li>手机<b>离屏幕 15~25cm</b> 扫（太近会失焦）</li>
    <li>屏幕亮度调到<b>中高</b>，别让屏幕反光</li>
    <li>微信扫一扫 → 把码框进取景框，等 2~3 秒</li>
    <li>如果扫不出，试试点「保存图片」再<b>从相册识别</b>（相机直扫和相册识别是两条不同路径）</li>
  </ol>
</div>
<div id="log"></div>

<script src="qrcode.js"></script>
<script>
/* ==========================================================================
   形状二维码 · 实测版
   ---------------------------------------------------------------------------
   做法：形状外的模块【不画】→ 码点自己围出形状。
   三条硬约束（不做就扫不出）：
     1. 三个角 8x8 定位图案必留
     2. 定位图案要跟主体连通（走廊）
     3. 数据容量：形状切掉的模块要靠"升版本"补 —— 所以按保留率折算选版本
   ========================================================================== */
(function () {
  'use strict';

  var TEXT = 'https://mafangqr.com';

  // ---------- 形状（单位坐标判定：点是否在形状内）----------
  var SHAPES = {
    square: function () { return true; },
    rounded: function (x, y) {
      var r = .11, a = Math.min(x, 1 - x), b = Math.min(y, 1 - y);
      if (a >= r || b >= r) return true;
      var da = r - a, db = r - b;
      return da * da + db * db <= r * r;
    },
    circle: function (x, y) {
      var a = x - .5, b = y - .5; return a * a + b * b <= .247;
    },
    heart: function (x, y) {
      var a = (x - .5) / .51, b = (.5 - y) / .51;
      var t = a * a + b * b - 1;
      return t * t * t - a * a * b * b * b <= 0;
    },
    drop: function (x, y) {
      if (y > .40) { var a = x - .5, b = y - .63; return a * a + b * b <= .355 * .355; }
      var t = (.40 - y) / .40, w = .355 * (1 - t * t * .92) + .010;
      return Math.abs(x - .5) <= w;
    },
    hexagon: function (x, y) {
      var a = Math.abs(x - .5), b = Math.abs(y - .5);
      return b <= .43 && a * .866 + b * .5 <= .43;
    },
    diamond: function (x, y) {
      return Math.abs(x - .5) + Math.abs(y - .5) <= .495;
    },
    petal4: function (x, y) {
      var a = x - .5, b = y - .5, r = Math.sqrt(a * a + b * b), th = Math.atan2(b, a);
      return r <= .495 * (.60 + .40 * Math.abs(Math.cos(2 * th)));
    },
    petal8: function (x, y) {
      var a = x - .5, b = y - .5, r = Math.sqrt(a * a + b * b), th = Math.atan2(b, a);
      return r <= .495 * (.78 + .22 * Math.abs(Math.cos(4 * th)));
    }
  };
  // 只保留经 zbar 实测能扫的形状。
  // 菱形、尖角水滴被剔除 —— 它们把码区四个角全切了，扫码器无法建立模块网格，
  // 试过 1~20 全部版本、静默边距 0~20% 全部组合，无一可扫（这不是调参问题，是几何不允许）。
  var ORDER = ['square', 'rounded', 'circle', 'heart', 'petal8', 'petal4', 'hexagon'];
  var NAME = { square: '方形（对照）', rounded: '圆角', circle: '圆形', heart: '心形',
               hexagon: '六边形', petal4: '四瓣花', petal8: '八瓣花' };

  // ---------- 定位图案保护区 ----------
  function inEye(x, y, n) {
    var b = 8 / n;
    return (x < b && y < b) || (x > 1 - b && y < b) || (x < b && y > 1 - b);
  }

  // ---------- 连通保护 ----------
  // 为什么需要：定位图案（三个回形框）必须与数据区**连通**，
  // 孤立的定位框扫码器认不出。同时定时图案那条线（第 6 行/列）被切断，
  // 扫码器就无法判定模块尺寸 —— 这是之前一多半形状扫不出的真正原因。
  //
  // 之前的做法（从定位图案斜插一条走廊进中心）有三个毛病：
  //   · 走廊穿过形状内部，在凹口处凭空长出码点，边缘毛糙
  //   · 宽度 2.2 模块，视觉上就是三条"腿"
  //   · 没管定时图案
  //
  // 现在改成"最小连通"：
  //   · 定位图案：只保留 8x8 本区，另加 1 模块宽的贴边连接带（贴着形状内侧走）
  //   · 定时图案：整行/整列强制保留（它是扫码器判定模块大小的标尺，动不得）
  function inTiming(x, y, n) {
    var m = 0.5 / n;                 // 半模块宽
    var lo = 8 / n - m, hi = 1 - 8 / n + m;
    // 第 6 行 / 第 6 列（0 基），落在码区中部那段
    var row6 = Math.abs(y - 6.5 / n) <= m;
    var col6 = Math.abs(x - 6.5 / n) <= m;
    return (row6 && x >= lo && x <= hi) || (col6 && y >= lo && y <= hi);
  }

  // 定位图案的"连通臂"。
  //
  // 【为什么必须留】定位图案若与数据区断开，扫码器认不出它 ——
  // 实测去掉后八瓣花/六边形立刻从可扫变不可扫。
  //
  // 【为什么不能四面扩】四面均匀外扩会在三个角撑出方块，
  // 圆形/心形的轮廓角上出现明显凸起，形状不干净（试过 0.6 模块，太窄不够连通）。
  //
  // 【现在的做法】只朝码区**中心方向**伸出一条臂：
  // 水平朝内 1.8 模块 + 垂直朝内 1.8 模块，臂宽 = 定位图案宽度。
  // 这样既把定位图案接进主体，又完全不侵入形状外侧的轮廓。
  function inEyeSpur(x, y, n) {
    var b = 8 / n;             // 定位图案边长（含隔离带）
    var reach = 2.6 / n;       // 朝内延伸的距离（1.8 时八瓣花仍不可扫，2.6 通过）
    var boxes = [[0, 0], [1 - b, 0], [0, 1 - b]];   // 左上的三个角
    for (var i = 0; i < 3; i++) {
      var x0 = boxes[i][0], y0 = boxes[i][1];
      // 朝内方向：左侧的盒子向右伸，上侧的盒子向下伸
      var right = (x0 === 0), below = (y0 === 0);
      var ex = right ? x0 + b + reach : x0;
      var ey = below ? y0 + b + reach : y0;
      if (x >= x0 && x <= ex && y >= y0 && y <= ey) return true;
    }
    return false;
  }  // ---------- 校正图案位置表（与 qrcode.js 内部一致）----------
  var ALIGN_POS = [[], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38],
    [6, 24, 42], [6, 26, 46], [6, 28, 50], [6, 30, 54], [6, 32, 58], [6, 34, 62],
    [6, 26, 46, 66], [6, 26, 48, 70], [6, 26, 50, 74], [6, 30, 54, 78],
    [6, 30, 56, 82], [6, 30, 58, 86], [6, 34, 62, 90], [6, 28, 50, 72, 94]];

  // 校正图案（5x5 + 1 隔离）坐标集合。
  // 【为什么必须保护】校正图案是扫码器用来矫正透视变形的基准点。
  // 实测证据：六边形/八瓣花在 v3(n=29) 可扫，一升到 v4(n=33) 就扫不出 ——
  // 差别就是 v4 多了一个位于 (26,26) 的校正图案，正好落在形状被裁的区域。
  // 定位图案管"找到码"，校正图案管"摆正码"，缺一不可。
  function alignPatterns(n) {
    var v = (n - 17) / 4;
    var pos = ALIGN_POS[v - 1] || [];
    var out = [];
    for (var i = 0; i < pos.length; i++) for (var j = 0; j < pos.length; j++) {
      var r = pos[i], c = pos[j];
      // 三个角上的校正图案与定位图案重叠，qrcode.js 会跳过，这里也跳过
      if ((r <= 8 && c <= 8) || (r <= 8 && c >= n - 9) || (r >= n - 9 && c <= 8)) continue;
      out.push([c, r]);
    }
    return out;
  }
  var alignCache = {};
  function inAlign(x, y, n) {
    var list = alignCache[n];
    if (!list) list = alignCache[n] = alignPatterns(n);
    var m = 3 / n;                    // 5x5 校正图案 + 半个隔离带
    for (var i = 0; i < list.length; i++) {
      var cx = (list[i][0] + .5) / n, cy = (list[i][1] + .5) / n;
      if (Math.abs(x - cx) <= m && Math.abs(y - cy) <= m) return true;
    }
    return false;
  }

  // ---------- 核心保护区（与形状无关，必须完整）----------
  // 三样东西动不得，动一个就扫不出：
  //   1. 定位图案（管"找到码"）      2. 校正图案（管"摆正码"）
  //   3. 定时图案（管"量出模块多大"）
  // 另外码区四周还要留够静默边距，否则边缘扫描线找不到边界。
  function isCore(x, y, n) {
    return inEye(x, y, n) || inAlign(x, y, n) || inTiming(x, y, n) || inEyeSpur(x, y, n);
  }

  // ---------- 保留判定：形状 ∪ 核心保护区 ∪ 静默边距 ----------
  // quiet：静默边距宽度（模块数）。形状码必须留一圈干净背景，
  // 否则尖角（水滴的顶尖、菱形的四个角）会顶到画布边缘，扫码器扫不到边界。
  function keepFn(key, n, quiet) {
    var s = SHAPES[key];
    var q = (quiet == null ? 2 : quiet) / n;
    return function (x, y) {
      if (isCore(x, y, n)) return true;
      if (x < q || x > 1 - q || y < q || y > 1 - q) {
        // 静默边距区：形状也要包含它，实际由"码区整体缩放"实现，这里不额外放行
        return s(x, y);
      }
      return s(x, y);
    };
  }

  // ---------- 保留率（与版本无关，用于估算容量折扣）----------
  var keepRatioCache = {};
  function keepRatio(key, n) {
    var ck = key + ':' + n;
    if (keepRatioCache[ck] != null) return keepRatioCache[ck];
    var keep = keepFn(key, n), u = 0;
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++)
      if (keep((c + .5) / n, (r + .5) / n)) u++;
    return (keepRatioCache[ck] = u / (n * n));
  }

  // ---------- 版本选择：用实测表，不靠公式估算 ----------
  // 为什么不用公式：形状裁掉的模块里，有一部分是"功能性图案"，损失不可线性折算，
  // 数学建模试了 4 轮误差都超过 20%。改用最可靠的办法 —— 预先把每个形状
  // × 每个版本真实生成并解码，把"最小可扫版本"固化下来。
  //
  // 版本越高的取舍：模块多了、数据能装下，但码点变小、形状被切掉的绝对模块也变多。
  // 实测结论：能扫的形状在 v3~v4 就够装常规网址，再高反而更容易失稳。
  // 数值来自穷举实测（probe_versions.py：每个形状 × v1~v20 真实生成 + zbar 解码）
  var MIN_VERSION = {
    square: 3, rounded: 3, circle: 3, heart: 3,
    petal8: 3, petal4: 3, hexagon: 3
  };

  // 内容变长时往上抬版本。
  //
  // 【为什么不用"标准容量 × 留存率"折算】我试过这个公式，它把版本抬得过高：
  // 实测 v3 明明能扫（数据装得下），公式却算成"装不下"→ 抬到 v4 → 反而扫不出。
  // 原因是 QR 的纠错冗余本来就是**为"整码丢失一部分"设计的**，形状裁掉的那些
  // 模块正落在纠错能力覆盖范围内，不能简单当线性损失扣掉。
  //
  // 所以判据只留一条硬标准：QRCore.generate 不抛错（真装得下）。
  function pickVersion(text, ec, key) {
    var base = MIN_VERSION[key] || 3;
    for (var v = base; v <= 40; v++) {
      try { window.QRCore.generate(text, ec, v); return v; }
      catch (e) { continue; }
    }
    return null;
  }

  // 标准容量表（由真实生成能力预先测得，见 capTable）
  var capTable = window.__CAP__ || null;

  // 退路：没预置容量表就用"扫描式"测（慢但准），结果缓存
  var capCache = {};
  function stdCapacity(v, ec) {
    if (capTable && capTable[ec]) return capTable[ec][v - 1];
    var k = v + ec;
    if (capCache[k] != null) return capCache[k];
    var lo = 0, hi = 4000, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      try { window.QRCore.generate('a'.repeat(mid), ec, v); best = mid; lo = mid + 1; }
      catch (e) { hi = mid - 1; }
    }
    return (capCache[k] = best);
  }

  function utf8Bytes(s) {
    if (window.TextEncoder) return new TextEncoder().encode(String(s));
    var out = [], str = unescape(encodeURIComponent(String(s)));
    for (var i = 0; i < str.length; i++) out.push(str.charCodeAt(i));
    return out;
  }

  // ---------- 生成 ----------
  function build(key) {
    var ec = 'H';                        // 形状码一律用最高纠错，补偿被裁的模块
    var v = pickVersion(TEXT, ec, key);
    if (v == null) return { err: '内容过长，无法放进「' + NAME[key] + '」' };
    var qr = window.QRCore.generate(TEXT, ec, v);
    var n = qr.size;
    var keep = keepFn(key, n);
    // 统计实际绘制模块
    var drawn = 0, out = 0;
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      if (!keep((c + .5) / n, (r + .5) / n)) { out++; continue; }
      drawn++;
    }
    return { qr: qr, n: n, keep: keep, v: v, ec: ec,
             keepRatio: drawn / (n * n), cut: out };
  }

  // ---------- 渲染 ----------
  function render(info, px) {
    var n = info.n, cell = Math.max(4, Math.floor(px / n));
    var side = cell * n;
    var cv = document.getElementById('cv');
    cv.width = cv.height = side;
    var g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, side, side);
    g.fillStyle = '#0a0c12';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      if (!info.qr.modules[r][c]) continue;
      if (!info.keep((c + .5) / n, (r + .5) / n)) continue;
      g.fillRect(c * cell, r * cell, cell, cell);
    }
    return side;
  }

  // ---------- UI ----------
  var cur = 0, logs = [];
  var tabs = document.getElementById('tabs');
  ORDER.forEach(function (k, i) {
    var b = document.createElement('button');
    b.textContent = NAME[k].replace('（对照）', '');
    b.dataset.k = k;
    b.addEventListener('click', function () { show(i); });
    tabs.appendChild(b);
  });

  function log(s) { logs.push(s); document.getElementById('log').textContent = logs.join('\n'); }

  function show(i) {
    cur = i;
    var k = ORDER[i];
    document.querySelectorAll('#tabs button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.k === k);
    });
    var info = build(k);
    var meta = document.getElementById('meta');
    if (info.err) {
      meta.innerHTML = '<span class="warn">' + info.err + '</span>';
      return;
    }
    render(info, Math.min(window.innerWidth * 0.78, 320));
    meta.innerHTML = '<b>' + NAME[k] + '</b> · 版本 ' + info.v + ' · 纠错 ' + info.ec
      + '<br>尺寸 ' + info.n + '×' + info.n + ' · 码点留存 '
      + (info.keepRatio * 100).toFixed(0) + '%';
    log('[' + k + '] v' + info.v + ' n' + info.n + ' keep=' + (info.keepRatio * 100).toFixed(1) + '%');
  }

  document.getElementById('next').addEventListener('click', function () { show((cur + 1) % ORDER.length); });
  document.getElementById('dl').addEventListener('click', function () {
    var cv = document.getElementById('cv');
    cv.toBlob(function (b) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'shape-' + ORDER[cur] + '.png';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    }, 'image/png');
  });

  // 预置容量表（node 实测导出，避免手机端做 4000 次二分扫描）

  // ---------- 自动化探针出口（只读，供穷举测试用；不参与产品逻辑）----------
  // 用途：对每个形状 × 每个版本组合真实生成并解码，找出"真正能扫的最小版本"。
  // 只暴露纯函数，外部拿不到可变状态。
  window.ShapeProbe = {
    keys: ORDER.slice(),
    name: NAME,
    text: TEXT,
    build: function (key, version, shrink) {
      try {
        var qr = window.QRCore.generate(TEXT, 'H', version);
        var n = qr.size;
        var keep = keepFn(key, n);
        if (shrink != null && shrink < 1) {
          // 诊断用：把形状朝中心收缩 shrink 倍，看收到多少才能扫
          // x' = 0.5 + (x-0.5)/shrink  → 相当于形状变大（留白更多）
          var sc = shrink;
          keep = function (x, y) {
            var nx = .5 + (x - .5) / sc, ny = .5 + (y - .5) / sc;
            return (SHAPES[key](nx, ny) && nx >= 0 && nx <= 1 && ny >= 0 && ny <= 1)
              || inEye(x, y, n) || inTiming(x, y, n) || inEyeSpur(x, y, n);
          };
        }
        return { ok: true, n: n, qr: qr, keep: keep };
      } catch (e) { return { ok: false, err: String(e) }; }
    },
    keepRatio: keepRatio,
    pickVersion: pickVersion,
    // 诊断用：inset 为"码区四周留白比例"。形状整体内缩，
    // 用于验证"尖角顶到画布边缘 → 静默边距不足"这个假设。
    keepAt: function (key, n, inset) {
      var s = SHAPES[key];
      var lo = inset, hi = 1 - inset, span = hi - lo;
      return function (x, y) {
        if (isCore(x, y, n)) return true;
        var nx = (x - lo) / span, ny = (y - lo) / span;
        if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return false;
        return s(nx, ny);
      };
    }
  };

  show(0);
