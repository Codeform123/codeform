<style>
  :root {
    --bg: #0a0c12;
    --bg-2: #111623;
    --panel: rgba(22, 28, 44, 0.72);
    --panel-solid: #161c2c;
    --line: rgba(120, 160, 255, 0.14);
    --line-strong: rgba(120, 160, 255, 0.28);
    --ink: #e8edf7;
    --ink-2: #9aa7c2;
    --ink-3: #5f6b85;
    --accent: #5b8cff;
    --accent-2: #22d3ee;
    --accent-3: #a06bff;
    --glow: rgba(91, 140, 255, 0.35);
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  /* 背景光斑 */
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%; filter: blur(120px); z-index: 0; pointer-events: none;
  }
  body::before { width: 520px; height: 520px; background: rgba(91,140,255,.20); top: -180px; left: -120px; }
  body::after { width: 480px; height: 480px; background: rgba(160,107,255,.16); bottom: -200px; right: -100px; }

  .app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 20px 60px; }

  /* 顶栏 */
  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0; gap: 20px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo { flex-shrink: 0; display: grid; place-items: center; }
  .logo img { width: 68px; height: 68px; display: block; }
  .brand h1 { font-size: 31px; font-weight: 700; letter-spacing: .3px; line-height: 1.15; }
  .brand .sub { font-size: 13px; color: var(--ink-3); letter-spacing: 11.53px; margin-right: -11.53px; text-transform: uppercase; margin-top: 3px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill {
    font-size: 12.5px; padding: 6px 13px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-2);
    background: rgba(255,255,255,.03); display: inline-flex; align-items: center; gap: 6px;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; }

  /* 主布局 */
  .grid { display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 22px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; backdrop-filter: blur(12px);
  }
  .card + .card { margin-top: 18px; }
  .card h2 {
    font-size: 13px; font-weight: 700; color: var(--ink-2); letter-spacing: 1.2px;
    text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .card h2::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: linear-gradient(var(--accent), var(--accent-3)); }

  /* 输入区 */
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab {
    font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer;
    color: var(--ink-2); border: 1px solid transparent; background: rgba(255,255,255,.03);
    transition: all .18s; user-select: none;
  }
  .tab:hover { color: var(--ink); border-color: var(--line-strong); }
  .tab.active {
    color: #fff; background: linear-gradient(135deg, rgba(91,140,255,.9), rgba(160,107,255,.9));
    box-shadow: 0 4px 16px var(--glow);
  }
  textarea, input[type="text"] {
    width: 100%; background: rgba(8,11,20,.72); border: 1px solid var(--line);
    border-radius: var(--radius-sm); color: var(--ink); font-size: 14px;
    padding: 14px; font-family: inherit; resize: vertical; outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  textarea { min-height: 128px; line-height: 1.65; }
  textarea:focus, input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,140,255,.14); }
  .hint { font-size: 12px; color: var(--ink-3); margin-top: 8px; }

  /* 表单行 */
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > .field { flex: 1; min-width: 140px; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 7px; }
  .field input[type="text"] { font-size: 13.5px; padding: 10px 12px; }

  /* 分段选择 */
  .seg { display: flex; gap: 4px; background: rgba(8,11,20,.6); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .seg button {
    flex: 1; border: none; background: transparent; color: var(--ink-2); font-size: 13px;
    padding: 8px 6px; border-radius: 7px; cursor: pointer; transition: all .16s; font-family: inherit;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.active { background: rgba(91,140,255,.22); color: #fff; box-shadow: inset 0 0 0 1px rgba(91,140,255,.5); }

  /* 颜色 */
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sw {
    width: 30px; height: 30px; border-radius: 9px; cursor: pointer;
    border: 2px solid transparent; transition: transform .14s, border-color .14s;
  }
  .sw:hover { transform: scale(1.12); }
  .sw.sel { border-color: #fff; box-shadow: 0 0 0 3px rgba(91,140,255,.4); }
  input[type="color"] {
    width: 34px; height: 30px; padding: 0; border: 1px solid var(--line);
    border-radius: 9px; background: transparent; cursor: pointer;
  }

  /* 滑杆 */
  input[type="range"] { width: 100%; accent-color: var(--accent); height: 4px; }
  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-row .val { font-size: 12.5px; color: var(--ink-2); min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }

  /* 上传 */
  .upload {
    border: 1.5px dashed var(--line-strong); border-radius: var(--radius-sm);
    padding: 16px; text-align: center; cursor: pointer; transition: all .18s;
    font-size: 13px; color: var(--ink-2); background: rgba(8,11,20,.4);
  }
  .upload:hover { border-color: var(--accent); color: var(--ink); background: rgba(91,140,255,.06); }

  /* 预览区 */
  .preview-wrap { position: sticky; top: 20px; }
  .preview-box {
    display: grid; place-items: center; padding: 28px;
    background:
      linear-gradient(45deg, rgba(255,255,255,.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.02) 75%),
      linear-gradient(45deg, rgba(255,255,255,.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.02) 75%);
    background-size: 20px 20px; background-position: 0 0, 10px 10px;
    border-radius: var(--radius); border: 1px solid var(--line);
  }
  #qrCanvas { max-width: 100%; height: auto; border-radius: 10px; display: block; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; padding: 12px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--line-strong); background: rgba(255,255,255,.04);
    color: var(--ink); transition: all .18s; font-family: inherit;
  }
  .btn:hover { background: rgba(255,255,255,.09); border-color: var(--accent); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-3)); border: none; color: #fff;
    box-shadow: 0 6px 20px var(--glow);
  }
  .btn.primary:hover { filter: brightness(1.12); box-shadow: 0 8px 26px var(--glow); }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-top: 12px; flex-wrap: wrap; gap: 8px; }

  .empty { color: var(--ink-3); font-size: 13.5px; text-align: center; padding: 40px 12px; }

  footer { text-align: center; margin-top: 40px; font-size: 12.5px; color: var(--ink-3); }
  footer a { color: var(--ink-2); text-decoration: none; }

  /* 提示 */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel-solid); border: 1px solid var(--line-strong);
    color: var(--ink); padding: 12px 22px; border-radius: 999px; font-size: 13.5px;
    opacity: 0; pointer-events: none; transition: all .26s; z-index: 99; box-shadow: 0 10px 32px rgba(0,0,0,.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">

  <div class="grid">

    <div class="left">
      <div class="card">

          <div class="tab" data-type="vcard">名片</div>
        </div>

        <div id="panel-text">
          <textarea id="inputText" placeholder="输入任意文字内容…&#10;例如：你好，这是我的二维码">https://workbuddy.cn</textarea>
        </div>

        <div id="panel-url" class="hidden">

          </div>
          <div class="row" style="margin-top:12px">
            <div class="field"><label>加密方式</label>
              <div class="seg" id="wifiEnc">

            </div>

        </div>

        <div id="panel-vcard" class="hidden">

          <div class="row" style="margin-top:12px">
            <div class="field"><label>公司</label><input type="text" id="vcOrg" placeholder="某某科技"></div>
            <div class="field"><label>邮箱</label><input type="text" id="vcMail" placeholder="hi@example.com"></div>
          </div>
        </div>

        <div class="hint">所有内容仅在浏览器内处理，不会上传到任何服务器。</div>
      </div>

      <div class="card">
        <h2>样式 Style</h2>

        <div class="field" style="margin-bottom:16px">
          <label>前景色</label>
          <div class="swatches" id="fgSwatches">
            <input type="color" id="fgColor" value="#0a0c12">
            <div class="sw sel" data-c="#0a0c12" style="background:#0a0c12"></div>
            <div class="sw" data-c="#1e3a8a" style="background:#1e3a8a"></div>
            <div class="sw" data-c="#7c3aed" style="background:#7c3aed"></div>
            <div class="sw" data-c="#be123c" style="background:#be123c"></div>
            <div class="sw" data-c="#047857" style="background:#047857"></div>
            <div class="sw" data-c="#b45309" style="background:#b45309"></div>
          </div>
        </div>

        <div class="field" style="margin-bottom:16px">
          <label>背景色</label>
          <div class="swatches" id="bgSwatches">
            <input type="color" id="bgColor" value="#ffffff">
            <div class="sw sel" data-c="#ffffff" style="background:#ffffff"></div>
            <div class="sw" data-c="#f1f5f9" style="background:#f1f5f9"></div>
            <div class="sw" data-c="#fef3c7" style="background:#fef3c7"></div>
            <div class="sw" data-c="#0a0c12" style="background:#0a0c12"></div>
            <div class="sw" data-c="#000000" style="background:#000000"></div>
          </div>
        </div>

        <div class="field" style="margin-bottom:16px">
          <label>码点形状</label>
          <div class="seg" id="dotStyle">
            <button class="active" data-v="square">方形</button>
            <button data-v="rounded">圆角</button>
            <button data-v="dot">圆点</button>
          </div>
        </div>

        <div class="field" style="margin-bottom:16px">
          <label>纠错等级 <span style="color:var(--ink-3)">（越高越抗损，码更密）</span></label>
          <div class="seg" id="ecLevel">
            <button data-v="L">L</button>
            <button class="active" data-v="M">M</button>
            <button data-v="Q">Q</button>
            <button data-v="H">H</button>
          </div>
        </div>

        <div class="field" style="margin-bottom:16px">
          <label>留白边距</label>
          <div class="slider-row">
            <input type="range" id="margin" min="0" max="8" value="4">
            <span class="val" id="marginVal">4</span>
          </div>
        </div>

        <div class="field">
          <label>中心 Logo（可选）</label>
          <div class="upload" id="logoDrop">点击选择图片 · 自动圆形裁切</div>
          <input type="file" id="logoInput" accept="image/*" class="hidden">
          <div style="margin-top:8px"><button class="btn" id="clearLogo" style="padding:7px;font-size:12.5px">移除 Logo</button></div>
        </div>
      </div>
    </div>

    <!-- 右：预览 -->
    <div class="preview-wrap">
      <div class="card">
        <h2>预览 Preview</h2>
        <div class="preview-box">
          <canvas id="qrCanvas" width="600" height="600"></canvas>
        </div>
        <div class="meta">
          <span id="versionInfo">版本 —</span>
          <span id="sizeInfo">—</span>
        </div>
        <div class="actions">
          <button class="btn primary" id="downloadPng">下载 PNG</button>
          <button class="btn" id="downloadSvg">SVG</button>
        </div>
        <div class="actions" style="margin-top:10px">
          <button class="btn" id="copyImage" style="font-size:13px">复制到剪贴板</button>
          <button class="btn" id="resetAll" style="font-size:13px">重置样式</button>
        </div>
      </div>
      <div class="card" style="padding:16px 20px">
        <div style="font-size:12.5px;color:var(--ink-2);line-height:1.75">
          <strong style="color:var(--ink)">为什么选码方？</strong><br>
          · <span style="color:var(--accent)">本地生成</span>：你的内容从始至终不离开浏览器<br>
          · <span style="color:var(--accent-2)">实时预览</span>：改一个参数，立即看到效果<br>
          · <span style="color:var(--accent-3)">无广告无弹窗</span>：干净的工具，本该如此
        </div>
      </div>
    </div>
  </div>

  <footer>码方二维码 Codeform · 纯本地生成，无需注册 &nbsp;|&nbsp; 内容不上传 · 完全本地处理</footer>
</div>

<div class="toast" id="toast"></div>

<script src="qrcode.js"></script>
<script src="app.js"></script>
